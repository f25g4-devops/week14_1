name: ci-wf
on:
    pull_request:
        branches:
            - develop
        types:
            - opened
            - synchronize
            - reopened
jobs:
    linting_job:
        runs-on: ubuntu-latest
        steps:
            - name: Clone repo on the runner
              uses: actions/checkout@v6
            - name: Install dependencies
              run: npm install
            - name: Lint HTML Files
              run: npx htmlhint "**/*.html"
            - name: Lint CSS Files
              run: npx stylelint "**/*.css"
    app_build_job:
        needs: linting_job
        runs-on: ubuntu-latest
        steps:
            - name: Clone repo on the runner
              uses: actions/checkout@v6
            - name: Install Dev Dep
              run: npm install
            - name: Build website with parcel
              run: npx parcel build "./src/index.html" --dist-dir "./dist" --public-url "./" --no-cache
    image-build-job:
        needs: app_build_job
        runs-on: ubuntu-latest
        steps:
            - name: Clone repo on the runner
              uses: actions/checkout@v6
            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}
            - name: Build Docker Image
              run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/g4w12:latest .
            - name: List the images
              run: docker image ls
            - name: Push Docker Image to Docker Hub
              run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/g4w12:latest
